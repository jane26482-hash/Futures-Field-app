<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const auth = window.__fbAuth;
const db   = window.__fbDb;

const reportsPath = 'reports';
const logsPath = 'dailyLogs';
const constructionsPath = 'constructions'; // 공사 일지 경로
const userPath = (uid) => `users/${uid}`;

const CATEGORIES = ['경기 중 시설 VOC', '일일 화재점검', '일일 안전 및 시설 점검', '긴급화재안전점검(6/2~6/3)', '행사 점검'];
const TRADES = ['전기', '소방', '기계', '건축', '안전'];
const STATUSES = ['조치 대기', '조치 중', '조치 완료', '이상없음', '긴급'];
const LOG_CATEGORIES = ['일일 시설안전 점검', '일일 화재점검'];

// --- 아이콘 컴포넌트 ---
function Icon({ name, size = 24, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      window.lucide.createIcons({ root: ref.current });
    }
  }, [name, size, className]);
  return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}><i data-lucide={name} style={{width: size, height: size}}></i></span>;
}

// --- 공용 모달 컴포넌트 ---
function ConfirmModal({ title, message, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4">
      <div className="bg-white rounded-3xl w-full max-w-sm shadow-2xl p-8 text-center border border-gray-100">
        <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5">
          <Icon name="trash-2" size={40} className="text-red-500" />
        </div>
        <h3 className="text-xl font-black text-gray-900 mb-3">{title}</h3>
        <p className="text-sm text-gray-500 mb-8 font-bold leading-relaxed break-keep">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-black rounded-xl">취소</button>
          <button onClick={onConfirm} className="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-xl shadow-md">삭제하기</button>
        </div>
      </div>
    </div>
  );
}

// --- 커스텀 이미지 기반 뷰어 (구글맵 대체) ---
function GoogleImageMap({ location, onChange }) {
  return (
    <div className="relative w-full h-[400px] bg-[#e5e5e5] rounded-xl overflow-hidden shadow-inner group select-none cursor-crosshair border border-gray-300 flex items-center justify-center text-center">
      <img 
        src="./map_image.png" 
        alt="커스텀 지도" 
        className="absolute inset-0 w-full h-full object-cover pointer-events-none"
        onError={(e) => { 
          e.target.style.display = 'none';
          e.target.nextSibling.style.display = 'block';
        }} 
      />
      <div className="hidden text-gray-500 font-bold bg-white/80 p-4 rounded-lg pointer-events-none relative z-0">
        map_image.png 파일을<br/>index.html과 같은 폴더에 넣어주세요.
      </div>
      <div className="absolute inset-0 bg-black/0 hover:bg-black/10 transition-colors z-10" onClick={(e) => {
          if (!onChange) return;
          const rect = e.currentTarget.getBoundingClientRect();
          onChange({ x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 });
        }}>
        {location && (
          <span className="absolute -translate-x-1/2 -translate-y-full pointer-events-none" style={{ left: `${location.x}%`, top: `${location.y}%` }}>
            <Icon name="map-pin" size={42} className="text-red-500 drop-shadow-md" />
          </span>
        )}
        {!location && onChange && (
          <div className="absolute top-4 left-4 bg-black/80 text-white text-sm font-bold px-4 py-2.5 rounded-lg shadow-md opacity-0 group-hover:opacity-100 pointer-events-none">
            지도의 원하는 위치를 클릭하여 핀을 꽂아주세요.
          </div>
        )}
      </div>
    </div>
  );
}

// --- 사용자 등록 컴포넌트 ---
function RegisterForm({ user, setProfile, setView, showToast }) {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [loading, setLoading] = useState(false);

  const handleRegister = async (e) => {
    e.preventDefault();
    if (!name.trim() || !email.trim()) { showToast('이름과 이메일을 모두 입력해주세요.'); return; }
    setLoading(true);
    try {
      const userData = { uid: user.uid, name, email, createdAt: Date.now() };
      await db.doc(userPath(user.uid)).set(userData);
      setProfile(userData); setView('dashboard'); showToast('환영합니다!');
    } catch (err) { showToast('가입 중 오류가 발생했습니다.'); }
    finally { setLoading(false); }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div className="flex justify-center mb-6"><div className="bg-blue-50 p-5 rounded-full"><Icon name="file-warning" size={48} className="text-blue-600" /></div></div>
        <h2 className="text-2xl font-black text-center mb-3 text-slate-800">시설안전점검통합시스템 (강화)</h2>
        <p className="text-gray-500 text-center mb-8 text-sm font-bold bg-gray-100 py-2 rounded-lg">업무 기록을 위해 프로필 설정이 필요합니다.</p>
        <form onSubmit={handleRegister} className="flex flex-col gap-5">
          <div>
            <label className="block text-sm font-bold text-gray-700 mb-2">이름 (점검자명) *</label>
            <input type="text" required className="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 bg-gray-50 font-bold" value={name} onChange={e => setName(e.target.value)} placeholder="홍길동" />
          </div>
          <div>
            <label className="block text-sm font-bold text-gray-700 mb-2">업무용 이메일 *</label>
            <input type="email" required className="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 bg-gray-50 font-bold" value={email} onChange={e => setEmail(e.target.value)} placeholder="work@company.com" />
          </div>
          <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl mt-4 shadow-md">{loading ? '등록 중...' : '시스템 시작하기'}</button>
        </form>
      </div>
    </div>
  );
}

// --- 엑셀로 내보내기 탭 ---
function ExcelExportView({ reports }) {
  const getSixMonthsAgo = () => { const d = new Date(); d.setMonth(d.getMonth() - 6); return d.toISOString().split('T')[0]; };
  const getStartOfMonth = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0]; };
  const getToday = () => new Date().toISOString().split('T')[0];

  const [startDate, setStartDate] = useState(getStartOfMonth());
  const [endDate, setEndDate] = useState(getToday());
  const [isExporting, setIsExporting] = useState(false);
  const sixMonthsLimit = getSixMonthsAgo();

  const handleExport = async () => {
    if (!window.ExcelJS) { alert("엑셀 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요."); return; }
    if (startDate < sixMonthsLimit) { alert('데이터베이스 정책에 따라 6개월이 지난 데이터는 영구 삭제되어 내보낼 수 없습니다.'); return; }

    const filtered = reports.filter(r => r.date >= startDate && r.date <= endDate);
    if (filtered.length === 0) { alert('해당 기간에 등록된 시설안전점검 데이터가 없습니다.'); return; }

    setIsExporting(true);

    try {
      const workbook = new window.ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('점검내역');

      sheet.columns = [
        { header: '점검일자', key: 'date', width: 15 },
        { header: '대분류', key: 'category', width: 25 },
        { header: '공종', key: 'trade', width: 12 },
        { header: '점검자', key: 'inspectorName', width: 15 },
        { header: '상태', key: 'status', width: 15 },
        { header: '현장사진', key: 'photo', width: 30 },
        { header: '상세위치', key: 'locationDesc', width: 30 },
        { header: '사진설명', key: 'photoDesc', width: 40 },
        { header: '비고', key: 'remarks', width: 30 }
      ];

      sheet.getRow(1).font = { bold: true, size: 12 };
      sheet.getRow(1).alignment = { horizontal: 'center', vertical: 'middle' };
      sheet.getRow(1).height = 30;

      filtered.forEach((r, index) => {
        const row = sheet.addRow({
          date: r.date || '', category: r.category || '', trade: r.trade || '',
          inspectorName: r.inspectorName || '', status: r.status || '',
          locationDesc: r.locationDesc || '', photoDesc: r.photoDesc || '', remarks: r.remarks || ''
        });

        row.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };

        if (r.photoBase64) {
          row.height = 110; 
          try {
            const mimeMatch = r.photoBase64.match(/data:image\/(.*);base64/);
            const ext = mimeMatch ? mimeMatch[1] : 'jpeg';
            const imageId = workbook.addImage({ base64: r.photoBase64, extension: ext });
            sheet.addImage(imageId, { tl: { col: 5.1, row: index + 1.1 }, ext: { width: 140, height: 140 }, editAs: 'oneCell' });
          } catch(e) { row.getCell(6).value = "이미지 오류"; }
        } else {
          row.getCell(6).value = "사진 없음";
        }
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
      link.download = `시설안전점검_내역_${startDate}~${endDate}.xlsx`;
      link.style.display = "none"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    } catch (e) { alert("엑셀 변환 중 오류가 발생했습니다."); } finally { setIsExporting(false); }
  };

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-10 w-full max-w-4xl mx-auto mt-6 animate-in fade-in duration-300">
      <div className="flex items-center gap-3 mb-8 border-b pb-6">
        <div className="bg-green-100 p-4 rounded-full"><Icon name="file-spreadsheet" size={32} className="text-green-600"/></div>
        <div>
          <h2 className="text-2xl font-black text-gray-900">엑셀(.xlsx)로 내보내기</h2>
          <p className="text-gray-500 font-bold mt-1">원하는 기간을 설정하여 점검 데이터를 다운로드하세요. (최대 6개월)</p>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div><label className="block text-sm font-bold text-gray-700 mb-2">시작일</label><input type="date" value={startDate} min={sixMonthsLimit} onChange={e => setStartDate(e.target.value)} className="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 font-bold text-gray-800 focus:ring-2 focus:ring-green-500" /></div>
        <div><label className="block text-sm font-bold text-gray-700 mb-2">종료일</label><input type="date" value={endDate} min={sixMonthsLimit} onChange={e => setEndDate(e.target.value)} className="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 font-bold text-gray-800 focus:ring-2 focus:ring-green-500" /></div>
      </div>

      <div className="flex gap-3 mb-8">
        <button onClick={() => { const d = new Date(); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1); setStartDate(new Date(d.setDate(diff)).toISOString().split('T')[0]); setEndDate(getToday()); }} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-bold text-gray-700 transition-colors">이번 주</button>
        <button onClick={() => { setStartDate(getStartOfMonth()); setEndDate(getToday()); }} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-bold text-gray-700 transition-colors">이번 달</button>
      </div>

      <button onClick={handleExport} disabled={isExporting} className="w-full bg-green-600 hover:bg-green-700 text-white font-black py-5 rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 text-lg">
        {isExporting ? <><Icon name="clock" size={24} className="animate-spin" /> 파일 생성 중...</> : <><Icon name="download" size={24}/> 설정한 기간 데이터 엑셀 다운로드</>}
      </button>
    </div>
  );
}

// --- 일일 일지 (캘린더) 컴포넌트 ---
function CalendarView({ logs, reports, constructions, userProfile, showToast }) {
  const [currentDate, setCurrentDate] = useState(new Date());
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [selectedDateStr, setSelectedDateStr] = useState('');
  const [category, setCategory] = useState(LOG_CATEGORIES[0]);
  const [location, setLocation] = useState('');
  const [inspectorName, setInspectorName] = useState(userProfile.name);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [formError, setFormError] = useState('');
  const [deleteTargetId, setDeleteTargetId] = useState(null);

  const year = currentDate.getFullYear(); const month = currentDate.getMonth();
  const fmt = (y, m, d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const todayStr = fmt(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

  const cells = [];
  for (let i = 0; i < new Date(year, month, 1).getDay(); i++) cells.push(null);
  for (let i = 1; i <= new Date(year, month+1, 0).getDate(); i++) cells.push(i);

  const handleDayClick = (day) => {
    if (!day) return;
    setSelectedDateStr(fmt(year, month, day));
    setCategory(LOG_CATEGORIES[0]); setLocation(''); setInspectorName(userProfile.name); setFormError('');
    setIsModalOpen(true);
  };

  const handleSaveLog = async () => {
    if (!location.trim() || !inspectorName.trim()) { setFormError('위치와 점검자를 입력해주세요.'); return; }
    setIsSubmitting(true);
    try {
      await db.collection(logsPath).add({ date: selectedDateStr, category, location, inspectorName, inspectorUid: userProfile.uid, createdAt: Date.now() });
      showToast('저장되었습니다.'); setIsModalOpen(false);
    } catch { setFormError('저장 중 오류 발생'); }
    finally { setIsSubmitting(false); }
  };

  const deleteLog = async () => {
    try { await db.collection(logsPath).doc(deleteTargetId).delete(); showToast('삭제되었습니다.'); } catch { showToast('삭제 오류'); }
    setDeleteTargetId(null);
  };

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 md:p-8 w-full animate-in fade-in duration-300">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-4">
          <button onClick={() => setCurrentDate(new Date(year, month-1, 1))} className="p-2 hover:bg-gray-100 rounded-full border shadow-sm"><Icon name="chevron-left" /></button>
          <h2 className="text-xl md:text-3xl font-black text-slate-800">{year}년 {month+1}월</h2>
          <button onClick={() => setCurrentDate(new Date(year, month+1, 1))} className="p-2 hover:bg-gray-100 rounded-full border shadow-sm"><Icon name="chevron-right" /></button>
        </div>
        <button onClick={() => setCurrentDate(new Date())} className="px-4 py-2.5 bg-slate-100 font-bold rounded-xl text-sm whitespace-nowrap shrink-0">오늘로 이동</button>
      </div>

      <div className="grid grid-cols-7 gap-px bg-gray-200 border rounded-t-xl overflow-hidden">
        {['일','월','화','수','목','금','토'].map((d,i) => <div key={d} className={`bg-slate-50 py-3 text-center text-base font-black ${i===0?'text-red-600':i===6?'text-blue-600':'text-slate-700'}`}>{d}</div>)}
      </div>

      <div className="grid grid-cols-7 gap-px bg-gray-200 border-x border-b rounded-b-xl min-h-[700px] w-full">
        {cells.map((day, idx) => {
          if (!day) return <div key={`e-${idx}`} className="bg-white/50 min-h-[160px]" />;
          const dateStr = fmt(year, month, day); const isToday = dateStr === todayStr;
          const dayLogs = logs.filter(l => l.date === dateStr);
          
          // 배지 연동: ssg 퓨처스 필드 글 등록 확인 및 공사 일정 확인
          const hasReport = reports.some(r => r.date === dateStr);
          const expectedConsts = constructions.filter(c => c.expectedDate === dateStr);
          const completedConsts = constructions.filter(c => c.completedDate === dateStr);

          return (
            <div key={`d-${day}`} onClick={() => handleDayClick(day)}
              className={`bg-white cursor-pointer flex flex-col group relative overflow-hidden ${isToday ? 'min-h-[160px] md:min-h-[220px] border-[3px] border-blue-500 shadow-xl z-10 p-2 md:p-3 ring-4 ring-blue-100/50 scale-[1.02]' : 'min-h-[160px] p-2 hover:bg-blue-50/50'}`}>
              <div className="flex justify-between items-start mb-2 shrink-0">
                <span className={`text-sm md:text-base font-black flex items-center justify-center rounded-full ${isToday ? 'bg-blue-600 text-white w-8 h-8' : 'w-7 h-7 text-slate-700 group-hover:text-blue-600'}`}>{day}</span>
                <span className="opacity-0 group-hover:opacity-100 text-blue-400 p-0.5"><Icon name="plus" size={16}/></span>
              </div>
              <div className="flex flex-col gap-1.5 flex-1 overflow-y-auto pr-1">
                
                {/* ssg 퓨처스 필드 점검 연동 배지 */}
                {hasReport && (
                  <div className="bg-blue-100 text-blue-700 text-[11px] xl:text-xs font-black px-2 py-1.5 rounded-lg shadow-sm border border-blue-200 flex items-center gap-1 shrink-0">
                    <Icon name="check-circle" size={14}/> 일일점검 완료
                  </div>
                )}

                {/* 공사 일지 예정 배지 */}
                {expectedConsts.map(c => (
                  <div key={`exp-${c.id}`} className="bg-red-50 text-red-700 text-[11px] xl:text-xs font-black px-2 py-1.5 rounded-lg shadow-sm border border-red-200 flex items-center gap-1 shrink-0 overflow-hidden">
                    <Icon name="siren" size={14} className="shrink-0 animate-pulse"/> <span className="truncate">{c.name} - 예정</span>
                  </div>
                ))}

                {/* 공사 일지 완료 배지 */}
                {completedConsts.map(c => (

// --- 공사 일지 입력/수정 컴포넌트 ---
function ConstructionForm({ existingData, onSave, onCancel, showToast }) {
  const [formData, setFormData] = useState(existingData || {
    name: '', trade: TRADES[0], photoBase64: '', expectedDate: new Date().toISOString().split('T')[0], completedDate: ''
  });
  const [error, setError] = useState('');
  const [isSubmitting, setSubmit] = useState(false);
  
  const set = (f, v) => { setFormData(p => ({...p, [f]: v})); if(error) setError(''); };

  const uploadImage = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image(); img.src = ev.target.result;
      img.onload = () => {
        const cvs = document.createElement('canvas'); const scale = img.width > 800 ? 800/img.width : 1;
        cvs.width = img.width * scale; cvs.height = img.height * scale;
        cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
        set('photoBase64', cvs.toDataURL('image/jpeg', 0.7));
      };
    }; reader.readAsDataURL(file);
  };

  const submit = async () => {
    if (!formData.name.trim()) { setError('공사명을 입력해주세요.'); return; }
    // 🚨 사진 필수 검증 부분 제거 🚨
    // if (!formData.photoBase64) { setError('공사 사진을 첨부해 주세요.'); return; }
    
    setSubmit(true);
    try {
      const data = { ...formData, updatedAt: Date.now() };
      delete data.id;

      if (existingData) { await db.collection(constructionsPath).doc(existingData.id).update(data); } 
      else { data.createdAt = Date.now(); await db.collection(constructionsPath).add(data); }

      showToast('공사 일지가 저장되었습니다.'); onSave();
    } catch(err) { setError('저장 중 오류가 발생했습니다.'); } 
    finally { setSubmit(false); }
  };

  return (
    <div className="bg-white rounded-2xl shadow-sm border p-6 md:p-8 w-full max-w-4xl mx-auto">
      <h2 className="text-2xl font-black mb-6 border-b pb-4 flex items-center gap-2"><Icon name="hammer" className="text-blue-600"/> {existingData ? '공사 일지 수정' : '신규 공사 일지 작성'}</h2>
      {error && <div className="bg-red-50 text-red-700 p-4 rounded-xl mb-6 font-bold flex items-center gap-3"><Icon name="alert-circle"/> {error}</div>}
      
      <div className="space-y-6">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label className="block text-sm font-bold mb-2">공사명 *</label><input type="text" className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.name} onChange={e => set('name', e.target.value)} placeholder="예: 1루측 배관 공사" /></div>
          <div><label className="block text-sm font-bold mb-2">공종 분류 *</label><select className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.trade} onChange={e => set('trade', e.target.value)}>{TRADES.map(t => <option key={t}>{t}</option>)}</select></div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label className="block text-sm font-bold mb-2">공사 예정일 (필수)</label><input type="date" className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.expectedDate} onChange={e => set('expectedDate', e.target.value)} /></div>
          <div><label className="block text-sm font-bold mb-2">공사 완료일 (공사 완료 시 지정)</label><input type="date" className="w-full p-3 border rounded-xl bg-gray-50 font-bold" value={formData.completedDate} onChange={e => set('completedDate', e.target.value)} /></div>
        </div>
        <div>
          {/* 🚨 (선택) 으로 텍스트 변경 🚨 */}
          <label className="block text-sm font-bold mb-2 flex items-center gap-2"><Icon name="camera" className="text-blue-600"/> 공사 사진 첨부 (선택)</label>
          {formData.photoBase64 ? (
            <div className="relative w-full rounded-xl overflow-hidden border flex justify-center group"><img src={formData.photoBase64} className="max-h-64 object-contain bg-gray-50"/><button onClick={() => set('photoBase64','')} className="absolute top-3 right-3 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100"><Icon name="x"/></button></div>
          ) : (
            <label className="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed rounded-xl bg-gray-50 cursor-pointer"><Icon name="camera" size={48} className="mb-3 text-gray-400"/><span className="font-bold text-gray-500">사진 업로드 (선택사항)</span><input type="file" className="hidden" accept="image/*" onChange={uploadImage}/></label>
          )}
        </div>
      </div>
      
      <div className="flex gap-4 mt-8 pt-6 border-t">
        <button onClick={onCancel} className="flex-1 py-4 bg-gray-100 hover:bg-gray-200 font-black rounded-xl transition-colors">취소</button>
        <button onClick={submit} disabled={isSubmitting !== false} className="flex-[2] py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl disabled:opacity-50 transition-colors shadow-md active:scale-95 flex justify-center items-center gap-2">
          {isSubmitting ? <><Icon name="clock" size={20} className="animate-spin" /> 저장 처리 중...</> : '저장 완료하기'}
        </button>
      </div>
    </div>
  );
}

        const cvs = document.createElement('canvas'); const scale = img.width > 800 ? 800/img.width : 1;

  };

  const handleMigration = async () => {
    if (!window.confirm("정말로 모든 '조치 예정' 상태를 '조치 대기'로 바꾸시겠습니까? (이 작업은 되돌릴 수 없습니다!)")) return;
    try {
      const snap = await db.collection(reportsPath).where('status', '==', '조치 예정').get();
      if (snap.empty) {
        alert("업데이트 할 '조치 예정' 글이 더 이상 존재하지 않습니다.");
        return;
      }
      const batch = db.batch();
      snap.docs.forEach(doc => {
        batch.update(doc.ref, { status: '조치 대기' });
      });
      await batch.commit();
      alert(`🎉 총 ${snap.size}개의 글이 '조치 대기' 상태로 정상 변경되었습니다!`);
    } catch(e) {
      alert("업데이트 중 오류 발생: " + e.message);
    }
  };

  useEffect(() => {
    let isResolved = false;
    const fallbackTimer = setTimeout(() => {
      if (!isResolved) {
        setAuthError('Firebase 응답이 없습니다. Vercel 도메인 승인이나 Firestore 규칙 설정을 다시 한 번 확인해 주세요.');
        setView('error');
      }
    }, 5000);

    const checkAuth = async () => {
      try {
        await auth.signInAnonymously();
      } catch (err) {
        isResolved = true;
        clearTimeout(fallbackTimer);
        if (err.code === 'auth/unauthorized-domain') {
          setAuthError('Vercel 배포 주소가 Firebase에 등록되지 않았습니다! \n\n[해결방법]\n1. Firebase 콘솔 접속\n2. 좌측 Authentication 클릭\n3. 상단 Settings(설정) 탭 클릭\n4. Authorized domains(승인된 도메인) 메뉴로 이동\n5. Add domain(도메인 추가)을 눌러 현재 Vercel 사이트 주소를 추가하세요.');
        } else {
          setAuthError(`로그인 오류가 발생했습니다: ${err.message}`);
        }
        setView('error');
      }
    };
    checkAuth();

    const unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        isResolved = true;
        clearTimeout(fallbackTimer);
        setUser(u);
        try {
          const snap = await db.collection('users').doc(u.uid).get();
          if (snap.exists) {
            setUserProfile(snap.data());
            setView('dashboard');
          } else {
            setView('register');
          }
        } catch (err) {
          setAuthError(`데이터베이스 접속 권한 오류입니다. \n\nFirebase Console -> Firestore Database -> 규칙(Rules) 탭에서 아래와 같이 설정해주세요.\n\nmatch /{document=**} {\n  allow read, write: if true;\n}\n\n(상세 에러: ${err.message})`);
          setView('error');
        }
      }
    });

    return () => { unsub(); clearTimeout(fallbackTimer); };
  }, []);

  useEffect(() => {
    if (!user || !userProfile) return;
    
    const sixMonthsMs = 15552000000;

    const cleanupAndSet = (path, setFn) => {
      return db.collection(path).onSnapshot(snap => {
        const now = Date.now();
        const validData = [];
        snap.docs.forEach(d => {
          const data = d.data();
          if (data.createdAt && Number.isInteger(data.createdAt) && (now - data.createdAt > sixMonthsMs)) {
            db.collection(path).doc(d.id).delete().catch(e => console.error("자동 삭제 오류", e));
          } else {
            validData.push({id: d.id, ...data});
          }
        });
        if(path !== logsPath) validData.sort((a, b) => b.createdAt - a.createdAt);
        setFn(validData);
      }, err => console.error(`DB Error (${path}):`, err));
    };

    const unsubReports = cleanupAndSet(reportsPath, setReports);
    const unsubLogs = cleanupAndSet(logsPath, setDailyLogs);
    const unsubConst = cleanupAndSet(constructionsPath, setConstructions);

    return () => { unsubReports(); unsubLogs(); unsubConst(); };
  }, [user, userProfile]);

  if (view === 'error') return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
      <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center border-t-8 border-red-500">
        <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="alert-circle" size={40} className="text-red-500"/></div>
        <h2 className="text-2xl font-black text-gray-900 mb-4">접속 오류 발생</h2>
        <p className="text-sm text-gray-700 mb-8 font-bold leading-relaxed bg-gray-50 p-4 rounded-xl text-left whitespace-pre-wrap">{authError}</p>
        <button onClick={() => window.location.reload()} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-4 rounded-xl shadow-md">새로고침 재시도</button>
      </div>
    </div>
  );

  if (view === 'loading') return (
    <div className="min-h-screen flex flex-col items-center justify-center bg-gray-50 text-gray-500">
      <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 border-solid mb-4"></div>
      <span className="font-black text-lg mt-4">시스템 접속 중입니다...</span>
    </div>

  if (view === 'register') return <RegisterForm user={user} setProfile={setUserProfile} setView={setView} showToast={toast} />;

  const filtered = reports.filter(r => {
    const matchSearch = (r.title || '').includes(searchTerm) || (r.locationDesc || '').includes(searchTerm);
    const matchStatus = statusFilter ? r.status === statusFilter : true;
    const matchCategory = categoryFilter ? r.category === categoryFilter : true;
    return matchSearch && matchStatus && matchCategory;
  });

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col font-sans pb-10">

        <div className="w-full px-4 md:px-8 h-16 flex items-center justify-between max-w-[1800px] mx-auto">
          <div className="flex items-center gap-2 cursor-pointer hover:opacity-80" onClick={() => { setView('dashboard'); setActiveTab('voc'); }}>
            <Icon name="file-warning" size={24} className="text-yellow-400 shrink-0"/>
            <span className="font-bold text-[13px] sm:text-base md:text-lg tracking-tight whitespace-nowrap">시설안전점검통합시스템 (강화)</span>
          </div>
          <div className="flex items-center gap-2 text-sm bg-slate-700 px-3 py-1.5 rounded-full shadow-inner shrink-0">
            <Icon name="user" size={16}/> <span className="font-bold truncate max-w-[100px] sm:max-w-none">{userProfile?.name} 님</span>
          </div>
        </div>
      </header>

      <main className="flex-1 w-full max-w-full p-3 md:p-6 flex flex-col gap-6">
        {view !== 'dashboard' && (
          <button onClick={() => { setView('dashboard'); setSelected(null); setSelectedConst(null); }} className="flex items-center gap-2 text-slate-600 hover:text-slate-900 font-black bg-white px-5 py-3 rounded-xl shadow-sm border border-gray-200 mx-auto max-w-7xl w-full transition-transform hover:scale-[1.01]">
            <Icon name="home" size={20}/> 대시보드로 돌아가기
          </button>
        )}

        {view === 'dashboard' && (
          <div className="w-full max-w-[1800px] mx-auto flex flex-col gap-6">
            <div className="flex flex-wrap bg-white p-1.5 rounded-2xl shadow-sm border border-gray-200 w-fit">
              <button onClick={() => setActiveTab('voc')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='voc'?'bg-slate-800 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="file-warning" size={18}/> ssg 퓨처스 필드
              </button>
              <button onClick={() => setActiveTab('construction')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='construction'?'bg-slate-800 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="hammer" size={18}/> 공사 일지
              </button>
              <button onClick={() => setActiveTab('calendar')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='calendar'?'bg-slate-800 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>
                <Icon name="calendar" size={18}/> 일일 일지

              <button onClick={() => setActiveTab('excel')} className={`px-6 py-3 rounded-xl text-sm font-black flex items-center gap-2 transition-all ${activeTab==='excel'?'bg-green-600 text-white shadow-md':'text-gray-500 hover:bg-gray-100'}`}>

            {/* --- SSG 퓨처스 필드 탭 --- */}
            {activeTab === 'voc' && (

                  <StatusCard title="조치 중" count={reports.filter(r=>r.status==='조치 중').length} color="bg-yellow-50 text-yellow-700 border-yellow-200" iconName="clock"/>
                  <StatusCard title="조치 완료" count={reports.filter(r=>r.status==='조치 완료').length} color="bg-green-50 text-green-700 border-green-200" iconName="check-circle"/>
                  <StatusCard title="이상 없음" count={reports.filter(r=>r.status==='이상없음').length} color="bg-gray-100 text-gray-700 border-gray-300" iconName="shield-check"/>

                      <option value="">대분류 전체</option>
                      {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}

                    <div className="relative flex-1 min-w-[200px] w-full">
                      <Icon name="search" size={18} className="absolute left-4 top-3.5 text-gray-400 pointer-events-none"/>
                      <input type="text" placeholder="제목/상세위치 검색 (빈칸으로 검색 가능)" 
                             className="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl bg-gray-50 outline-none text-sm font-bold" 
                             value={tempSearchTerm} 
                             onChange={e => setTempSearchTerm(e.target.value)} 
                             onKeyDown={e => { if(e.key === 'Enter') handleSearch(); }} />
                    </div>

                    <button onClick={handleSearch} className="bg-slate-700 hover:bg-slate-800 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-black shadow-md transition-transform hover:scale-[1.02] active:scale-95 w-full sm:w-auto shrink-0">
                      <Icon name="search" size={18}/> 검색
                    </button>
                  </div>

                  <div className="w-full lg:w-auto shrink-0 border-t lg:border-t-0 pt-4 lg:pt-0 border-gray-100 flex justify-end">
                    <button onClick={() => { setSelected(null); setView('form'); }} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl flex items-center justify-center gap-2 font-black shadow-md transition-transform hover:scale-[1.02] active:scale-95 w-full sm:w-auto">
                      <Icon name="plus" size={18}/> 신규 등록
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                      <thead className="bg-gray-100 border-b border-gray-200 text-gray-700">
                        <tr>
                          <th className="p-5 font-black w-32 text-center">진행상태</th>
                          <th className="p-5 font-black">대분류</th>
                          <th className="p-5 font-black">공종</th>
                          <th className="p-5 font-black w-full">제목</th>
                          <th className="p-5 font-black">점검자</th>
                          <th className="p-5 font-black">점검일자</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {filtered.length === 0 ? (
                          <tr><td colSpan="6" className="p-16 text-center text-gray-500 font-bold">등록된 점검 내역이 없습니다.</td></tr>
                        ) : filtered.map(r => {
                          const isEmergency = r.status === '긴급';
                          return (
                            <tr key={r.id} onClick={() => { setSelected(r); setView('detail'); }} className={`hover:bg-blue-50 cursor-pointer transition-colors group ${isEmergency ? 'bg-red-50/30' : ''}`}>
                              <td className="p-5 text-center">
                                <span className={`px-4 py-1.5 rounded-full text-xs font-black border shadow-sm ${
                                  r.status==='조치 완료'?'bg-green-100 text-green-700 border-green-200':
                                  r.status==='이상없음'?'bg-gray-100 text-gray-700 border-gray-300':
                                  r.status==='조치 중'?'bg-yellow-100 text-yellow-700 border-yellow-200':
                                  r.status==='조치 대기'?'bg-orange-100 text-orange-700 border-orange-200':
                                  r.status==='긴급'?'bg-red-100 text-red-700 border-red-200':
                                  'bg-white text-gray-700 border-gray-300'
                                }`}>{r.status}</span>
                              </td>
                              <td className={`p-5 font-bold ${isEmergency ? 'text-red-600' : 'text-gray-600'}`}>{r.category}</td>
                              <td className={`p-5 font-black ${isEmergency ? 'text-red-600' : 'text-gray-800'}`}>{r.trade}</td>
                              <td className={`p-5 font-black max-w-[200px] md:max-w-md overflow-hidden text-ellipsis ${isEmergency ? 'text-red-600' : 'text-gray-900 group-hover:text-blue-700'}`}>{r.title}</td>
                              <td className={`p-5 font-bold ${isEmergency ? 'text-red-600' : 'text-gray-600'}`}>{r.inspectorName}</td>
                              <td className={`p-5 font-bold ${isEmergency ? 'text-red-600' : 'text-gray-600'}`}>{r.date}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="mt-8 p-5 bg-gray-50 border border-gray-200 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="text-sm text-gray-600 font-bold flex items-center">
                    <Icon name="alert-circle" size={20} className="text-blue-500 mr-3 shrink-0" />
                    <span>[관리자 도구] 이전에 작성했던 글 중 상태가 '조치 예정'으로 남아있는 글들을 새로운 시스템에 맞게 '조치 대기' 상태로 일괄 변경합니다.</span>
                  </div>
                  <button onClick={handleMigration} className="px-5 py-3 bg-slate-700 text-white text-sm font-black rounded-xl shadow-md hover:bg-slate-800 transition-colors whitespace-nowrap shrink-0 active:scale-95">
                    구버전 데이터 일괄 업데이트
                  </button>
                </div>

              </div>
            )}

            {/* --- 공사 일지 탭 --- */}
            {activeTab === 'construction' && (
              <div className="w-full max-w-7xl mx-auto animate-in fade-in duration-300">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-black flex items-center gap-2"><Icon name="hammer" className="text-slate-800"/> 공사 일지</h2>
                  <button onClick={() => { setSelectedConst(null); setView('const-form'); }} className="bg-slate-800 text-white px-6 py-3 rounded-xl font-black shrink-0"><Icon name="plus" size={18}/> 신규 공사 등록</button>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {constructions.map(c => {
                    const isCompleted = !!c.completedDate;
                    return (
                      <div key={c.id} onClick={() => { setSelectedConst(c); setView('const-detail'); }} className="bg-white rounded-2xl shadow-sm border p-5 cursor-pointer hover:shadow-md transition-shadow group flex flex-col h-full">
                        <div className="flex justify-between items-start mb-3">
                          <span className={`px-3 py-1.5 rounded-full text-xs font-black border flex items-center gap-1 shadow-sm ${isCompleted ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'}`}>
                            {isCompleted ? <><Icon name="flag" size={14}/> 완료됨</> : <><Icon name="siren" size={14} className="animate-pulse text-red-500"/> 공사 중 (진행/예정)</>}
                          </span>
                          <span className="text-xs font-black bg-gray-100 px-2.5 py-1 rounded-md text-gray-600 border">{c.trade}</span>
                        </div>
                        <h3 className="font-black text-lg mb-4 text-slate-800 group-hover:text-blue-600">{c.name}</h3>
                        
                        {/* 사진이 있을 때만 표시 */}
                        {c.photoBase64 && <img src={c.photoBase64} className="w-full h-40 object-cover rounded-xl mb-4 border bg-gray-50"/>}
                        
                        <div className="mt-auto space-y-1 bg-gray-50 p-4 rounded-xl text-sm font-bold text-gray-600 border">
                          <p className="flex justify-between"><span>예정일:</span> <span>{c.expectedDate || '-'}</span></p>
                          <p className={`flex justify-between pt-1 border-t mt-1 ${isCompleted ? 'text-green-600' : 'text-gray-400'}`}>
                            <span>완료일:</span> <span>{c.completedDate || '미정'}</span>

                      </div>

                  })}
                  {constructions.length === 0 && <div className="col-span-full p-16 text-center text-gray-500 font-bold bg-white rounded-2xl border">등록된 공사 일지가 없습니다.</div>}
                </div>
              </div>
            )}

            {activeTab === 'calendar' && <CalendarView logs={dailyLogs} reports={reports} constructions={constructions} userProfile={userProfile} showToast={toast} />}
            
            {activeTab === 'excel' && <ExcelExportView reports={reports} />}
          </div>
        )}

        {/* 폼 및 상세 화면 */}

        {/* 공사 일지 폼 및 상세 화면 */}

        {view === 'const-detail' && selectedConst && (
          <div className="w-full max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border p-8 animate-in fade-in zoom-in-95 duration-200">
            <div className="flex justify-between items-center mb-6 pb-4 border-b">
              <h2 className="text-2xl font-black flex items-center gap-2"><Icon name="hammer"/> {selectedConst.name}</h2>
              <span className={`px-4 py-2 rounded-full text-sm font-black border flex items-center gap-1 shadow-sm ${selectedConst.completedDate ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'}`}>

              <button onClick={async () => { if(window.confirm('정말 삭제하시겠습니까?')) { await db.collection(constructionsPath).doc(selectedConst.id).delete(); toast('삭제되었습니다.'); setView('dashboard'); } }} className="px-6 py-3 bg-red-50 text-red-700 font-black rounded-xl hover:bg-red-100 flex items-center gap-2"><Icon name="trash-2" size={18}/> 삭제</button>
            </div>
          </div>
        )}
      </main>

      {toastMsg && (
        <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce border border-slate-700">
          <Icon name="check-circle" size={20} className="text-green-400"/>
          <span className="font-bold">{toastMsg}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
